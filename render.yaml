services:
  - type: cron
    name: binance-signal-bot
    runtime: python
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: "python main.py --once --pre-scan-seconds 180"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRYPTOQUANT_API_KEY
        sync: false
      - key: CRYPTOQUANT_EXCHANGES
        value: "all_exchange,binance"
      - key: MULTI_EXCHANGE_ENABLED
        value: "true"
      - key: REPORT_TIMEZONE
        value: "Europe/Brussels"
      - key: FUTURES_MODE_ENABLED
        value: "true"
      - key: FUTURES_MIN_CONFIDENCE
        value: "72"
      - key: FUTURES_MIN_EDGE
        value: "8"
      - key: FUTURES_MIN_RR
        value: "1.8"
      - key: FUTURES_TRACKING_ENABLED
        value: "true"
      - key: FUTURES_SIGNAL_HISTORY_FILE
        value: "futures_signal_history.json"
      - key: CORE_SYMBOLS
        value: "BTCUSDT,ETHUSDT"
      - key: ALT_CANDIDATES
        value: ""
      - key: ENABLE_ALTCOINS
        value: "false"
      - key: BTCUSDT_COST
        sync: false
      - key: ETHUSDT_COST
        sync: false
      - key: SOLUSDT_COST
        sync: false
  - type: worker
    name: binance-signal-worker
    runtime: python
    region: frankfurt
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "CORE_SYMBOLS=BTCUSDT,ETHUSDT ALT_CANDIDATES= ENABLE_ALTCOINS=false REPORT_TIMEZONE=Europe/Brussels REPORT_PROFILE_VERSION='BTC/ETH v2' python websocket_worker.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRYPTOQUANT_API_KEY
        sync: false
      - key: CRYPTOQUANT_EXCHANGES
        value: "all_exchange,binance"
      - key: MULTI_EXCHANGE_ENABLED
        value: "true"
      - key: REPORT_TIMEZONE
        value: "Europe/Brussels"
      - key: REPORT_PROFILE_VERSION
        value: "BTC/ETH v2"
      - key: FUTURES_MODE_ENABLED
        value: "true"
      - key: FUTURES_MIN_CONFIDENCE
        value: "72"
      - key: FUTURES_MIN_EDGE
        value: "8"
      - key: FUTURES_MIN_RR
        value: "1.8"
      - key: FUTURES_TRACKING_ENABLED
        value: "true"
      - key: FUTURES_SIGNAL_HISTORY_FILE
        value: "futures_signal_history.json"
      - key: CORE_SYMBOLS
        value: "BTCUSDT,ETHUSDT"
      - key: ALT_CANDIDATES
        value: ""
      - key: ENABLE_ALTCOINS
        value: "false"
      - key: REPORT_INTERVAL_SECONDS
        value: "300"
      - key: WORKER_WARMUP_SECONDS
        value: "300"
      - key: WEBSOCKET_RECONNECT_DELAY
        value: "5"
      - key: BTCUSDT_COST
        sync: false
      - key: ETHUSDT_COST
        sync: false
      - key: SOLUSDT_COST
        sync: false
