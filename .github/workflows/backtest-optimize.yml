name: Backtest Optimize

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-optimize
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run historical backtest
        run: >
          python backtester.py
          --days 30
          --sample-every 8
          --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT SUIUSDT NEARUSDT ONDOUSDT LINKUSDT FETUSDT
          --output backtest_results.json
          --weights-output signal_weights.json

      - name: Commit optimized weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_weights.json
          git diff --cached --quiet || git commit -m "Update optimized signal weights"
          git push
