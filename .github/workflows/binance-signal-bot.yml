name: Binance Signal Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-signal-bot
  cancel-in-progress: true

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TIMEZONE: Europe/Brussels
          REPORT_PROFILE_VERSION: BTC/ETH v2
          FUTURES_MODE_ENABLED: "true"
          OPTIMIZED_WEIGHTS_ENABLED: "true"
          OPTIMIZED_WEIGHTS_FILE: optimized_weights.json
          FUTURES_MIN_CONFIDENCE: "72"
          FUTURES_MIN_EDGE: "8"
          FUTURES_MIN_RR: "1.8"
          FUTURES_TRACKING_ENABLED: "true"
          FUTURES_SIGNAL_HISTORY_FILE: futures_signal_history.json
          MULTI_EXCHANGE_ENABLED: "true"
          MULTI_EXCHANGE_LIST: binance,coinbase,kraken,okx,bybit,kucoin,mexc
          CRYPTOQUANT_EXCHANGES: all_exchange,binance
          CORE_SYMBOLS: BTCUSDT,ETHUSDT
          ALT_CANDIDATES: ""
          ENABLE_ALTCOINS: "false"
          MAX_REPORT_SYMBOLS: "2"
          BTCUSDT_COST: ${{ secrets.BTCUSDT_COST }}
          ETHUSDT_COST: ${{ secrets.ETHUSDT_COST }}
          SOLUSDT_COST: ${{ secrets.SOLUSDT_COST }}
          FETUSDT_COST: ${{ secrets.FETUSDT_COST }}
          RENDERUSDT_COST: ${{ secrets.RENDERUSDT_COST }}
          ONDOUSDT_COST: ${{ secrets.ONDOUSDT_COST }}
          FILUSDT_COST: ${{ secrets.FILUSDT_COST }}
          ARBUSDT_COST: ${{ secrets.ARBUSDT_COST }}
          OPUSDT_COST: ${{ secrets.OPUSDT_COST }}
        run: python main.py --once --pre-scan-seconds 0
